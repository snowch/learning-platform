# The cross-book regression job.
#
# One job per repository, each running that repository's own check as its CI runs it, from a
# fresh checkout of its default branch. The books are never modified by this work; this workflow
# only tells us when a shared idea breaks one of them. It runs on request and once a week, not on
# push, because nothing pushed here changes a book.
#
# Two more jobs run each course against this repository's current packages rather than the copy
# the course carries: the regression check for a change to the platform itself. They change
# nothing in either course; each works on a fresh checkout.
#
# What each job can and cannot run in a hosted runner follows docs/inventory.md section 2 of the
# course repository: the Rust and Python suites of the two interactive books, the pytest suites of
# the two prose books without their cross toolchains, and the course's own `npm run check`. Each
# book's job installs what that book's own quality workflow installs: requirements.txt and
# requirements-dev.txt, which is where pytest lives.

name: Cross-book regression

on:
  workflow_dispatch:
    inputs:
      digital_design_ref:
        description: Branch or tag of snowch/digital-design to check
        default: main
        required: false
      metadata_systems_ref:
        description: Branch or tag of snowch/metadata-systems to check (empty for its default branch)
        default: ""
        required: false
  schedule:
    - cron: "17 6 * * 1"

jobs:
  digital-design:
    name: digital-design (npm run check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: snowch/digital-design
          ref: ${{ inputs.digital_design_ref || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: ./scripts/check.sh

  sizing-and-tco:
    name: sizing-and-tco (pytest, models, numbers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: snowch/sizing-and-tco
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python scripts/build-stamp.py
      - run: python -m pytest tests/ -m "not problem" -q
      - run: python scripts/verify-models.py
      - run: python scripts/verify-numbers.py

  computer-systems:
    name: computer-systems (pytest without the cross toolchain)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: snowch/computer-systems
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python scripts/verify-setup.py
        continue-on-error: true
      # The disassembly test and four problem checks need riscv64-linux-gnu-gcc to regenerate
      # listings that are committed; they are deselected here exactly as the inventory recorded,
      # so a red job means a real regression.
      - run: >-
          python -m pytest tests/ -m "not problem" -q
          --deselect tests/test_disasm.py
          --deselect tests/c_for_people_who_will_read_a_kernel/test_problem_1_which_c.py::test_the_four_listings_are_distinguishable
          --deselect tests/machine_level_code_on_riscv/test_problem_1_reconstruct.py::test_the_target_is_not_trivially_guessable
          --deselect tests/machine_level_code_on_riscv/test_problem_2_frames.py::test_the_four_are_not_all_the_same
          --deselect tests/machine_level_code_on_riscv/test_problem_3_who_saves.py::test_the_function_uses_both_kinds

  parquet-book:
    name: parquet-book (cargo test, wasm build, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: snowch/parquet-book
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cargo test --workspace
      - run: cargo build --target wasm32-unknown-unknown -p pqlab-wasm
        continue-on-error: true
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests python/tests exercises/python -q

  query-engine-book:
    name: query-engine-book (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: snowch/query-engine-book
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The parity test runs the book's Python under Pyodide, which npm installs; the report test
      # runs the book's package in a subprocess, which needs the path the book's own check exports.
      - run: npm install --no-audit --no-fund
      - run: python -m pytest -q
        env:
          PYTHONPATH: python:external/parquet-book/python

  metadata-systems:
    name: metadata-systems (npm run check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: snowch/metadata-systems
          ref: ${{ inputs.metadata_systems_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: ./scripts/check.sh

  metadata-systems-on-this-platform:
    name: metadata-systems on this repository's packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: platform-repo
      - uses: actions/checkout@v4
        with:
          repository: snowch/metadata-systems
          ref: ${{ inputs.metadata_systems_ref }}
          path: course
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The course's own sync replaces its copy with these packages and records this commit, so
      # its "copy is unedited" stage checks the copy it is now running.
      - run: node scripts/sync-platform.mjs ../platform-repo
        working-directory: course
      # npm install, not npm ci: the packages' own dependencies may have moved on from the course's
      # lockfile, and that is part of what this job finds out.
      - run: npm install --no-audit --no-fund
        working-directory: course
      - run: npx playwright install --with-deps chromium
        working-directory: course
      - run: ./scripts/check.sh
        working-directory: course
        env:
          CI: "true"

  digital-design-on-this-platform:
    name: digital-design on this repository's packages (tsc, Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: platform-repo
      - uses: actions/checkout@v4
        with:
          repository: snowch/digital-design
          ref: ${{ inputs.digital_design_ref || 'main' }}
          path: course
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Once the course takes these packages as a checked copy (scripts/sync-platform.mjs, as the
      # metadata course does), sync this repository's current packages into it. Until that change
      # reaches the ref under test, the course carries its own copy under the old @dd/ names
      # (docs/adoption.md): replace it and rename the imports, exactly as the switch did.
      - name: Put this repository's packages in the course
        working-directory: course
        run: |
          if [ -f scripts/sync-platform.mjs ]; then
            node scripts/sync-platform.mjs ../platform-repo
          else
            for p in lesson-schema lesson-runtime primitives; do
              rm -rf packages/$p && cp -r ../platform-repo/packages/$p packages/$p
            done
            grep -rl --include='*.ts' --include='*.tsx' --include='*.mts' --include='*.json' \
              -e '@dd/lesson-schema' -e '@dd/lesson-runtime' -e '@dd/primitives' \
              apps packages content tests scripts \
              | xargs sed -i 's#@dd/lesson-schema#@platform/lesson-schema#g; s#@dd/lesson-runtime#@platform/lesson-runtime#g; s#@dd/primitives#@platform/primitives#g'
          fi
      - run: npm install --no-audit --no-fund
        working-directory: course
      - run: npx tsc --noEmit -p tsconfig.json
        working-directory: course
      - run: npx vitest run
        working-directory: course
